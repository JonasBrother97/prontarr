name: Test and publish
'on':
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches: [main]
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  security:
    uses: ./.github/workflows/security.yml
    secrets: inherit
  build:
    name: Runtime build and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build runtime and run API/controller integration tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: runtime
          load: true
          tags: prontarr:ci
          no-cache-filters: runtime
          push: false
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Export runtime image
        run: docker save prontarr:ci --output "$RUNNER_TEMP/prontarr-image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-image
          path: ${{ runner.temp }}/prontarr-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  zig-unit:
    name: Zig unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Zig unit tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: unit
          push: false
          cache-from: type=gha,scope=zig-unit
          cache-to: type=gha,scope=zig-unit,mode=max
  runtime-smoke:
    name: Container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-image
          path: ${{ runner.temp }}
      - name: Load tested runtime image
        run: docker load --input "$RUNNER_TEMP/prontarr-image.tar"
      - name: Verify the non-root runtime starts
        shell: bash
        run: |
          docker run --detach --name prontarr-smoke --publish 127.0.0.1:5882:5882 prontarr:ci
          trap 'docker logs prontarr-smoke; docker rm --force prontarr-smoke' EXIT
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5882/api/health > /tmp/prontarr-health.json; then
              python3 -c 'import json; h=json.load(open("/tmp/prontarr-health.json")); assert h["status"] == "ok" and h["live_actions_enabled"] is False'
              test "$(docker exec prontarr-smoke id -u)" = "10001"
              exit 0
            fi
            sleep 1
          done
          exit 1
    needs:
      - build
  syft:
    name: Syft SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-image
          path: ${{ runner.temp }}
      - name: Load tested runtime image
        run: docker load --input "$RUNNER_TEMP/prontarr-image.tar"
      - name: Generate runtime SBOM with Syft
        uses: anchore/sbom-action@73fc65f9f613b4bb1305b6957eddd1217aa991ff
        with:
          image: prontarr:ci
          syft-version: v1.57.2
          format: spdx-json
          output-file: runtime.spdx.json
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-sbom
          path: runtime.spdx.json
          retention-days: 14
          if-no-files-found: error
    needs:
      - build
  grype:
    name: Grype
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-sbom
      - name: Scan runtime SBOM with Grype
        if: ${{ !cancelled() }}
        uses: anchore/scan-action@aba84ded01d96bc7ffd9ede169adb6b27e8bc9fb
        with:
          sbom: runtime.spdx.json
          grype-version: v0.122.1
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: grype.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: grype-report
          path: grype.json
          retention-days: 14
          if-no-files-found: error
    needs:
      - syft
  trivy:
    name: Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-image
          path: ${{ runner.temp }}
      - name: Load tested runtime image
        run: docker load --input "$RUNNER_TEMP/prontarr-image.tar"
      - name: Scan runtime with Trivy
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          image-ref: prontarr:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: trivy-report
          path: trivy.json
          retention-days: 14
          if-no-files-found: error
    needs:
      - build
  runtime-summary:
    name: Runtime security summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: '*-report'
          merge-multiple: true
      - name: Summarize runtime vulnerability findings
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          rows = set()
          reports = [name for name in ['grype.json', 'trivy.json'] if Path(name).is_file()]
          if Path('grype.json').is_file():
              data = json.loads(Path('grype.json').read_text())
              for match in data.get('matches', []):
                  v, p = match['vulnerability'], match['artifact']
                  fixes = v.get('fix', {}).get('versions', [])
                  if v.get('severity', '').upper() in ['HIGH', 'CRITICAL'] and fixes:
                      rows.add((v['id'], p['name'], p['version'], ', '.join(fixes)))
          if Path('trivy.json').is_file():
              data = json.loads(Path('trivy.json').read_text())
              for result in data.get('Results', []):
                  for v in result.get('Vulnerabilities', []):
                      if v.get('Severity') in ['HIGH', 'CRITICAL'] and v.get('FixedVersion'):
                          rows.add((v['VulnerabilityID'], v['PkgName'], v['InstalledVersion'], v['FixedVersion']))
          summary = '## Runtime vulnerabilities\n\nReports: ' + ', '.join(reports) + '\n\nFixable high/critical findings: ' + str(len(rows)) + '\n\n'
          if len(reports) != 2:
              summary += 'A scanner report is missing; inspect the failed scan steps.\n\n'
          for row in sorted(rows):
              summary += '- ' + ' · '.join(str(x).replace('\n', ' ') for x in row) + '\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary)
          print(summary)
          PYREPORT
    needs:
      - grype
      - trivy
    if: ${{ !cancelled() && needs.grype.result != 'skipped' && needs.trivy.result != 'skipped' }}
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'JonasBrother97'
    needs:
      - build
      - zig-unit
      - runtime-smoke
      - syft
      - grype
      - trivy
      - security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: dockerhub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release belongs to trunk
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main || {
            echo "Release tags must reference a commit integrated into main."
            exit 1
          }
      - name: Check Docker Hub configuration
        env:
          TAG: ${{ github.ref_name }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo "Use a semantic version tag such as v0.4.0."; exit 1; }
          test -n "$USERNAME" || { echo "Set the DOCKERHUB_USERNAME repository variable."; exit 1; }
          test -n "$TOKEN" || { echo "Set the DOCKERHUB_TOKEN environment secret."; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: metadata
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/prontarr
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Publish verified image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
          provenance: true
          sbom: true
