name: Test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  security:
    uses: ./.github/workflows/security.yml
    secrets: inherit
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and test both applications
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: prontarr:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the non-root runtime starts
        shell: bash
        run: |
          docker run --detach --name prontarr-smoke --publish 127.0.0.1:5882:5882 prontarr:ci
          trap 'docker logs prontarr-smoke; docker rm --force prontarr-smoke' EXIT
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5882/api/health > /tmp/prontarr-health.json; then
              python3 -c 'import json; h=json.load(open("/tmp/prontarr-health.json")); assert h["status"] == "ok" and h["live_actions_enabled"] is False'
              test "$(docker exec prontarr-smoke id -u)" = "10001"
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Generate runtime SBOM with Syft
        uses: anchore/sbom-action@73fc65f9f613b4bb1305b6957eddd1217aa991ff
        with:
          image: prontarr:ci
          syft-version: v1.57.2
          format: spdx-json
          output-file: runtime.spdx.json
          upload-release-assets: false
      - name: Scan runtime SBOM with Grype
        if: ${{ !cancelled() }}
        uses: anchore/scan-action@aba84ded01d96bc7ffd9ede169adb6b27e8bc9fb
        with:
          sbom: runtime.spdx.json
          grype-version: v0.122.1
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: grype.json
      - name: Scan runtime with Trivy
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          image-ref: prontarr:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy.json
      - name: Retain vulnerability reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-security
          path: |
            runtime.spdx.json
            grype.json
            trivy.json
          retention-days: 14
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'JonasBrother97'
    needs: [test, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: dockerhub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Docker Hub configuration
        env:
          TAG: ${{ github.ref_name }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo "Use a semantic version tag such as v0.4.0."; exit 1; }
          test -n "$USERNAME" || { echo "Set the DOCKERHUB_USERNAME repository variable."; exit 1; }
          test -n "$TOKEN" || { echo "Set the DOCKERHUB_TOKEN environment secret."; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/prontarr
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Publish verified image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
