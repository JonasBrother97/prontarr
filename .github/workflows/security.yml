name: Source security
'on':
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@66f83c8206e0997178c8fd7bf1da9efccf5dd388
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --prefix frontend
      - run: npm run lint --prefix frontend
  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@66f83c8206e0997178c8fd7bf1da9efccf5dd388
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --prefix frontend
      - run: npm audit --prefix frontend --audit-level=high
  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@66f83c8206e0997178c8fd7bf1da9efccf5dd388
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --prefix frontend
      - run: npm run test:coverage --prefix frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 14
  python-unit:
    name: Python unit and ownership tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@90485b7ad25ff6932f80015b8a56a6546cd816a7
        with:
          python-version: '3.12'
      - run: 'pip install --only-binary=:all: coverage==7.17.3'
      - name: Test secret report gate
        run: |
          coverage run -m unittest discover -s tests -p security_gate_test.py
          coverage run --append tests/ownership_contract.py
          coverage xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-coverage
          path: coverage/python.xml
          retention-days: 14
  bandit:
    name: Bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@90485b7ad25ff6932f80015b8a56a6546cd816a7
        with:
          python-version: '3.12'
      - run: 'pip install --only-binary=:all: bandit==1.9.4'
      - name: Bandit Python integrations
        run: bandit -r integrations scripts -ll -ii
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@90485b7ad25ff6932f80015b8a56a6546cd816a7
        with:
          python-version: '3.12'
      - run: 'pip install --only-binary=:all: semgrep==1.186.0'
      - name: Semgrep local rules
        if: ${{ !cancelled() }}
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: semgrep scan --config .semgrep --error --metrics=off --disable-version-check frontend/src integrations scripts
  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@0e457b42d0120153c352875e9b758b1e5c58c7e5
        with:
          scan-args: |-
            scan
            --lockfile=frontend/package-lock.json
    name: OSV Scanner
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks entire history (redacted)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose --log-opts=--all --config /repo/.gitleaks.toml
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog entire history without credential verification
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo:ro" trufflesecurity/trufflehog:3.99.9@sha256:2ec535840f860aa27f11fee20222fb790326ecd66325c96bd49d02ec6af46eca git file:///repo --no-verification --fail --json > "$RUNNER_TEMP/trufflehog.json" 2> "$RUNNER_TEMP/trufflehog.log"
          result=$?
          set -e
          # Never print or upload raw credentials, including synthetic test matches.
          set +e
          python3 scripts/trufflehog_gate.py "$result" < "$RUNNER_TEMP/trufflehog.json"
          gate=$?
          set -e
          rm -f "$RUNNER_TEMP/trufflehog.json" "$RUNNER_TEMP/trufflehog.log"
          exit "$gate"
  sonar:
    concurrency:
      group: sonar-${{ github.repository }}
      cancel-in-progress: false
    needs:
      - frontend-unit
      - python-unit
    if: github.repository == 'JonasBrother97/prontarr' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-coverage
          path: coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Validate SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: test -n "$SONAR_TOKEN" && test -n "$SONAR_HOST_URL"
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.qualitygate.wait=true
    name: SonarQube
