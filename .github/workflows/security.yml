name: Source security
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@66f83c8206e0997178c8fd7bf1da9efccf5dd388
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - name: Audit production and development dependencies
        if: ${{ !cancelled() }}
        run: npm audit --prefix frontend --audit-level=high
  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@90485b7ad25ff6932f80015b8a56a6546cd816a7
        with:
          python-version: '3.12'
      - run: pip install bandit==1.9.4 semgrep==1.186.0
      - name: Bandit Python integrations
        run: bandit -r integrations scripts -ll -ii
      - name: Semgrep local rules
        if: ${{ !cancelled() }}
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: semgrep scan --config .semgrep --error --metrics=off --disable-version-check frontend/src integrations scripts
  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@0e457b42d0120153c352875e9b758b1e5c58c7e5
        with:
          scan-args: |-
            scan
            --lockfile=frontend/package-lock.json
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks entire history (redacted)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --log-opts=--all --config /repo/.gitleaks.toml
      - name: TruffleHog entire history without credential verification
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo:ro" trufflesecurity/trufflehog:3.99.9 git file:///repo --no-verification --fail --json > "$RUNNER_TEMP/trufflehog.json" 2> "$RUNNER_TEMP/trufflehog.log"
          result=$?
          set -e
          # Never print or upload raw credentials, including synthetic test matches.
          set +e
          python3 scripts/trufflehog_gate.py "$RUNNER_TEMP/trufflehog.json" "$result"
          gate=$?
          set -e
          rm -f "$RUNNER_TEMP/trufflehog.json" "$RUNNER_TEMP/trufflehog.log"
          exit "$gate"
  sonar:
    if: github.repository == 'JonasBrother97/prontarr' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: test -n "$SONAR_TOKEN" && test -n "$SONAR_HOST_URL"
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
